# nginx im Compose-Stack (Dienst "proxy"): liefert /static/ aus dem Volume "data"
# und leitet / an web, /mcp/ an mcp weiter. Für Betrieb ohne eigenen nginx davor.
upstream elisa_app { server web:8088; }
upstream elisa_mcp { server mcp:8765; }

map $http_x_forwarded_proto $elisa_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 64m;

    location /static/ {
        alias /var/lib/elisa/staticfiles/;
        access_log off; expires 7d;
    }

    location /mcp/ {
        proxy_pass http://elisa_mcp/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s; proxy_send_timeout 3600s;
        proxy_set_header Host              $http_host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $elisa_proto;
    }

    location / {
        proxy_pass http://elisa_app;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $elisa_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Connection        "";
    }
}
