# =============================================================================
# ELISA – nginx als Reverse-Proxy (HTTP) vor dem Podman-Stack (Metapaket
# elisa-stack). nginx läuft als www-data und liest die Static-Dateien, die der
# web-Container (ebenfalls www-data) nach /var/lib/elisa/data/staticfiles legt.
# __SERVER_NAME__ setzt das postinst (Domain, Dateiname <host.domain>.conf).
# TLS: davor terminieren (Load-Balancer/Cloudflare) oder elisa.nginx.conf nutzen.
# =============================================================================

upstream elisa_app { server 127.0.0.1:8088; }   # web (daphne)
upstream elisa_mcp { server 127.0.0.1:8765; }   # mcp (SSE)

# Vom vorgeschalteten Proxy gesetztes Schema bevorzugen, sonst das eigene.
map $http_x_forwarded_proto $elisa_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 64m;

    location /static/ {
        alias /var/lib/elisa/data/staticfiles/;
        access_log off; expires 7d;
    }

    # MCP-SSE (feste Adresse http(s)://<host>/mcp/<projekt>/<scope>/sse)
    location /mcp/ {
        proxy_pass http://elisa_mcp/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s; proxy_send_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $elisa_proto;
    }

    location / {
        proxy_pass http://elisa_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $elisa_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }
}
