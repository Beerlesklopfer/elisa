{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card mt-5">
      <div class="card-header bg-elisa-primary text-white">
        <i class="fas fa-key me-1"></i>{% trans "Passwort zurücksetzen" %}
      </div>
      <div class="card-body">
        <p class="text-muted small">{% trans "Geben Sie Ihre E-Mail-Adresse ein. Sie erhalten einen Link zum Zurücksetzen." %}</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">{% trans "E-Mail" %}</label>
            <input type="email" name="email" class="form-control" autofocus required>
          </div>
          <button class="btn btn-dark w-100">{% trans "Link anfordern" %}</button>
        </form>
        <a href="{% url 'login' %}" class="small d-inline-block mt-3">&larr; {% trans "Zurück zum Login" %}</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
