# =============================================================================
# ELISA – Nginx Site (Production, HTTPS/TLS) – Namensgebung wie CrystalKey
# =============================================================================
# Template: __SERVER_NAME__ wird beim Deploy ersetzt. Cert/Key nach Konvention:
#   /etc/ssl/certs/__SERVER_NAME__.pem  /  /etc/ssl/private/__SERVER_NAME__.key
# App unter / (daphne :8088), MCP fest unter /mcp/ (SSE, :8765).
# Unterstützt direkten HTTPS-Zugriff und Cloudflare Flexible/Full SSL.
# =============================================================================

upstream elisa_app { server 127.0.0.1:8088; }   # Django (daphne)
upstream elisa_mcp { server 127.0.0.1:8765; }   # MCP-SSE (uvicorn)

# Port 80: Cloudflare-Requests direkt bedienen, sonst auf HTTPS umleiten.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    access_log /var/log/nginx/__SERVER_NAME__-access.log;
    error_log  /var/log/nginx/__SERVER_NAME__-error.log;

    client_max_body_size 64m;

    # Direkter HTTP-Zugriff (kein Proxy davor) -> HTTPS erzwingen.
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    location /static/ {
        alias /var/lib/elisa/staticfiles/;
        access_log off; expires 7d;
    }

    # MCP-SSE (feste Adresse https://<host>/mcp/<projekt>/<scope>/sse)
    location /mcp/ {
        proxy_pass http://elisa_mcp/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s; proxy_send_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://elisa_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Connection        "";
    }
}

# Port 443: direkter HTTPS-Zugriff (oder Full-SSL hinter Cloudflare).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/ssl/certs/__SERVER_NAME__.pem;
    ssl_certificate_key /etc/ssl/private/__SERVER_NAME__.key;

    access_log /var/log/nginx/__SERVER_NAME__-access.log;
    error_log  /var/log/nginx/__SERVER_NAME__-error.log;

    client_max_body_size 64m;

    location /static/ {
        alias /var/lib/elisa/staticfiles/;
        access_log off; expires 7d;
    }

    # MCP-SSE (feste Adresse https://<host>/mcp/<projekt>/<scope>/sse)
    location /mcp/ {
        proxy_pass http://elisa_mcp/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off; proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s; proxy_send_timeout 3600s;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://elisa_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";
    }
}
